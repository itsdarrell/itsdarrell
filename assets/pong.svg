  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “also, make the logo bigger”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5833;0.6250" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “works on my machine”
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6250;0.6667" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “it was working yesterday”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6667;0.7083" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “did anyone touch it?”
