  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “we can pay you in exposure”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7500;0.7917" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “my landlord doesn't take exposure”
