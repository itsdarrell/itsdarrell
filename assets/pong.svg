  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “my nephew can build this”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8333;0.8750" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “then hire your nephew”
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8750;0.9167" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “I can do it with AI”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.9167;0.9583" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
