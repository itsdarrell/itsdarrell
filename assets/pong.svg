  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “it should be simple”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0833;0.1250" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “famous last words”
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1250;0.1667" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “can we have it by Friday?”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.2083" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “which Friday?”
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2083;0.2500" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “what's the cost?”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2500;0.2917" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “what's the budget?”
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2917;0.3333" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “can you do this?”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.3750" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “will you pay for it?”
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3750;0.4167" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0">client: “can you make it pop?”  →
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4167;0.4583" calcMode="discrete" dur="76.06s" repeatCount="indefinite"/>
  </text>
  <text x="450.0" y="35" font-size="18" font-weight="600" fill="#a78bfa" text-anchor="middle" opacity="0">←  architect: “define 'pop'”
